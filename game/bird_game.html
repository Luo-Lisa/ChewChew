<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识鸟小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a4d3e 0%, #0d3327 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #2d5a4a 0%, #1a3d30 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .exit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .home-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
        }

        .home-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
        }

        .start-screen {
            padding: 40px 20px;
            text-align: center;
        }

        .start-screen h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .start-screen p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            background: linear-gradient(135deg, #2d5a4a 0%, #1a3d30 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(45, 90, 74, 0.4);
        }

        .game-screen {
            padding: 20px;
            display: none;
        }

        .bird-image-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .bird-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .question-text {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .option-btn:hover:not(.selected) {
            background: #e8f5f0;
            border-color: #2d5a4a;
        }

        .option-btn.selected.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.selected.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .feedback-overlay {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .feedback {
            padding: 20px 40px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .correct-answer {
            display: none;
            padding: 15px 30px;
            background: #fff3cd;
            border: 2px solid #ffeeba;
            border-radius: 10px;
            text-align: center;
            color: #856404;
            font-size: 18px;
            font-weight: bold;
        }

        .result-screen {
            padding: 40px 20px;
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .score {
            font-size: 48px;
            color: #2d5a4a;
            margin-bottom: 10px;
        }

        .score-text {
            color: #666;
            margin-bottom: 30px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #2d5a4a 0%, #1a3d30 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(45, 90, 74, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="../final/index.html" class="home-btn">首页</a>
            <button class="exit-btn" onclick="exitGame()">退出游戏</button>
            <h1>识鸟小游戏</h1>
            <div class="game-info">
                <span>第 <span id="current-question">1</span> / 5 题</span>
                <span>得分: <span id="score">0</span></span>
            </div>
        </div>

        <div class="start-screen" id="start-screen">
            <h2>准备好挑战了吗？</h2>
            <p>观察图片中的鸟类，从四个选项中选出正确的鸟名。<br/>
            每关共5题，看看你能答对多少！</p>
            <button class="start-btn" onclick="startGame()">这是什么鸟</button>
        </div>

        <div class="game-screen" id="game-screen">
            <div class="feedback-overlay" id="feedback-overlay">
                <div class="feedback" id="feedback"></div>
                <div class="correct-answer" id="correct-answer"></div>
            </div>
            <div class="bird-image-container">
                <img src="" alt="鸟类图片" class="bird-image" id="bird-image">
            </div>
            <div class="question-text">这是什么鸟？</div>
            <div class="options" id="options">
                <button class="option-btn" onclick="selectAnswer(this)">选项1</button>
            </div>
        </div>

        <div class="result-screen" id="result-screen">
            <h2>游戏结束！</h2>
            <div class="score" id="final-score">0</div>
            <div class="score-text" id="score-text"></div>
            <button class="restart-btn" onclick="startGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const birdNames = ['乌鸫', '伯劳', '八哥', '北长尾山雀', '喜鹊', '夜鹭', '天鹅', '斑鸠', '灰喜鹊', '燕子', '白鹭', '红耳鹎', '翠鸟', '老鹰', '鸽子', '鹊鸲', '麻雀'];
        
        let currentQuestion = 0;
        let score = 0;
        let correctAnswer = '';
        let selected = false;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            selected = false;
            const usedIndices = new Set();
            
            const correctIndex = Math.floor(Math.random() * birdNames.length);
            correctAnswer = birdNames[correctIndex];
            usedIndices.add(correctIndex);

            const options = [correctAnswer];
            
            while (options.length < 4) {
                const randomIndex = Math.floor(Math.random() * birdNames.length);
                if (!usedIndices.has(randomIndex)) {
                    options.push(birdNames[randomIndex]);
                    usedIndices.add(randomIndex);
                }
            }

            shuffle(options);

            const birdImage = document.getElementById('bird-image');
            birdImage.src = `pictures/${correctAnswer}.png`;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';

            options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.onclick = () => selectAnswer(button);
                optionsContainer.appendChild(button);
            });

            document.getElementById('current-question').textContent = currentQuestion + 1;
            document.getElementById('score').textContent = score;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'correct', 'incorrect');
            });
            document.getElementById('feedback-overlay').style.display = 'none';
            document.getElementById('correct-answer').style.display = 'none';
        }

        function selectAnswer(button) {
            if (selected) return;
            selected = true;

            const isCorrect = button.textContent === correctAnswer;

            if (isCorrect) {
                button.classList.add('selected', 'correct');
                score++;
                document.getElementById('score').textContent = score;
                document.getElementById('feedback').textContent = '真棒！';
                document.getElementById('feedback').className = 'feedback correct';
                document.getElementById('feedback-overlay').style.display = 'block';
            } else {
                button.classList.add('selected', 'incorrect');
                document.getElementById('feedback').textContent = '加油！';
                document.getElementById('feedback').className = 'feedback incorrect';
                document.getElementById('correct-answer').textContent = `正确答案：${correctAnswer}`;
                document.getElementById('correct-answer').style.display = 'block';
                document.getElementById('feedback-overlay').style.display = 'block';
                
                document.querySelectorAll('.option-btn').forEach(btn => {
                    if (btn.textContent === correctAnswer) {
                        btn.classList.add('selected', 'correct');
                    }
                });
            }

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion >= 5) {
                    showResult();
                } else {
                    loadQuestion();
                }
            }, isCorrect ? 800 : 1500);
        }

        function showResult() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').textContent = score;
            
            let text = '';
            if (score === 5) {
                text = '完美！你是鸟类专家！';
            } else if (score >= 3) {
                text = '很棒！继续加油！';
            } else if (score >= 1) {
                text = '还不错，多多练习！';
            } else {
                text = '加油！多观察身边的鸟类吧！';
            }
            document.getElementById('score-text').textContent = text;
        }

        function exitGame() {
            if (confirm('确定要退出游戏吗？')) {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'block';
                currentQuestion = 0;
                score = 0;
                document.getElementById('current-question').textContent = 1;
                document.getElementById('score').textContent = 0;
            }
        }
    </script>
</body>
</html>
